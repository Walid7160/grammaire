                        <span class="time-element border-b-2 border-dashed border-slate-400 pb-0.5 cursor-pointer transition-all" data-type="gn">À l'approche de l'examen national</span>, l'ambiance à la maison changeait complètement. 
                        <span class="time-element border-b-2 border-dashed border-slate-400 pb-0.5 cursor-pointer transition-all" data-type="sub-sim">Pendant que <span class="verb-element">je révisais</span> mes cours de français</span>, ma mère préparait un bon thé à la menthe. 
                        Je relisais mes fiches de grammaire <span class="time-element border-b-2 border-dashed border-slate-400 pb-0.5 cursor-pointer transition-all" data-type="sub-post">avant que la nuit ne <span class="verb-element">tombe</span></span>. 
                        Le jour J, <span class="time-element border-b-2 border-dashed border-slate-400 pb-0.5 cursor-pointer transition-all" data-type="inf">après <span class="verb-element">avoir vérifié</span> ma convocation</span>, je suis parti au collège <span class="time-element border-b-2 border-dashed border-slate-400 pb-0.5 cursor-pointer transition-all" data-type="adv">tôt</span>. 
                        <span class="time-element border-b-2 border-dashed border-slate-400 pb-0.5 cursor-pointer transition-all" data-type="sub-ant">Dès que le surveillant <span class="verb-element">a distribué</span> les sujets</span>, j'ai commencé à rédiger avec confiance.
                    </p>
                    
                    <div class="mt-6 pt-4 border-t border-slate-100 flex flex-wrap gap-3">
