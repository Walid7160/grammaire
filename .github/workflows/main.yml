                                <p class="text-slate-600">• <span class="highlight-conj">Pendant qu'</span>il <span class="highlight-verb">pleut</span> (Ind. Présent), je reste à l'abri.</p>
                                <p class="text-slate-600">• <span class="highlight-conj">Lorsque</span> le professeur <span class="highlight-verb">expliquait</span> (Ind. Imparfait), nous écoutions.</p>
                            </div>
                        </div>

                        <!-- 2. ANTÉRIORITÉ -->
                        <div class="rounded-2xl border-2 border-emerald-200 bg-emerald-50/30 flex flex-col justify-between overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                            <div>
                                <div class="bg-emerald-600 text-white p-4 flex items-center justify-between">
                                    <div>
                                        <span class="text-xs uppercase tracking-wider font-semibold text-emerald-100 block">Rapport 2</span>
                                        <h4 class="font-heading font-bold text-lg">L'Antériorité</h4>
                                    </div>
                                    <i class="fa-solid fa-forward-step text-2xl opacity-80"></i>
                                </div>
                                <div class="p-5 space-y-4">
                                    <div class="bg-white p-3 rounded-xl border border-emerald-100 text-center">
                                        <span class="text-xs font-bold text-slate-500 block mb-1">Schéma temporel</span>
                                        <div class="flex items-center justify-center gap-1.5 text-xs font-bold text-emerald-700">
                                            <span class="px-2 py-1 bg-slate-100 text-slate-500 rounded">1. Subordonnée</span>
                                            <i class="fa-solid fa-arrow-right text-emerald-500"></i>
                                            <span class="px-2 py-1 bg-emerald-100 rounded border border-emerald-300">2. Principale</span>
                                        </div>
                                        <span class="text-[11px] text-slate-500 mt-1 block">L'action principale se passe <strong>APRÈS</strong> la subordonnée.</span>
                                    </div>

                                    <div>
                                        <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Conjonctions (Outils) :</span>
                                        <div class="flex flex-wrap gap-1.5 mt-2">
                                            <span class="px-2.5 py-1 bg-white border border-emerald-200 text-emerald-800 rounded-lg text-xs font-semibold">Après que ⚠️</span>
                                            <span class="px-2.5 py-1 bg-white border border-emerald-200 text-emerald-800 rounded-lg text-xs font-semibold">Dès que</span>
                                            <span class="px-2.5 py-1 bg-white border border-emerald-200 text-emerald-800 rounded-lg text-xs font-semibold">Aussitôt que</span>
                                            <span class="px-2.5 py-1 bg-white border border-emerald-200 text-emerald-800 rounded-lg text-xs font-semibold">Une fois que</span>
                                            <span class="px-2.5 py-1 bg-white border border-emerald-200 text-emerald-800 rounded-lg text-xs font-semibold">Depuis que</span>
                                            <span class="px-2.5 py-1 bg-white border border-emerald-200 text-emerald-800 rounded-lg text-xs font-semibold">Quand / Lorsque</span>
                                        </div>
                                    </div>

                                    <div class="bg-emerald-100/70 p-3 rounded-xl border border-emerald-200">
                                        <span class="text-xs font-bold text-emerald-900 flex items-center gap-1.5">
                                            <i class="fa-solid fa-key text-emerald-600"></i> Mode du verbe :
                                        </span>
                                        <p class="text-base font-extrabold text-emerald-700 mt-0.5">TOUJOURS L'INDICATIF</p>
                                        <p class="text-[11px] text-emerald-800">Souvent un temps composé (passé composé, plus-que-parfait, futur antérieur).</p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 bg-white border-t border-emerald-100 text-xs space-y-1.5">
                                <span class="font-bold text-slate-700 block">Exemples :</span>
                                <p class="text-slate-600">• <span class="highlight-conj">Après qu'</span>il <span class="highlight-verb">a terminé</span> (Ind. Passé Composé) son devoir, il sort jouer.</p>
                                <p class="text-slate-600">• <span class="highlight-conj">Dès que</span> tu <span class="highlight-verb">auras lu</span> (Ind. Futur Antérieur) ce livre, prête-le-moi.</p>
                            </div>
                        </div>

                        <!-- 3. POSTÉRIORITÉ -->
                        <div class="rounded-2xl border-2 border-amber-200 bg-amber-50/30 flex flex-col justify-between overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                            <div>
                                <div class="bg-amber-500 text-white p-4 flex items-center justify-between">
                                    <div>
                                        <span class="text-xs uppercase tracking-wider font-semibold text-amber-100 block">Rapport 3</span>
                                        <h4 class="font-heading font-bold text-lg">La Postériorité</h4>
                                    </div>
                                    <i class="fa-solid fa-backward-step text-2xl opacity-80"></i>
                                </div>
                                <div class="p-5 space-y-4">
                                    <div class="bg-white p-3 rounded-xl border border-amber-100 text-center">
                                        <span class="text-xs font-bold text-slate-500 block mb-1">Schéma temporel</span>
                                        <div class="flex items-center justify-center gap-1.5 text-xs font-bold text-amber-700">
                                            <span class="px-2 py-1 bg-amber-100 rounded border border-amber-300">1. Principale</span>
                                            <i class="fa-solid fa-arrow-right text-amber-500"></i>
                                            <span class="px-2 py-1 bg-slate-100 text-slate-500 rounded">2. Subordonnée</span>
                                        </div>
                                        <span class="text-[11px] text-slate-500 mt-1 block">L'action principale se passe <strong>AVANT</strong> la subordonnée.</span>
                                    </div>

                                    <div>
                                        <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Conjonctions (Outils) :</span>
                                        <div class="flex flex-wrap gap-1.5 mt-2">
                                            <span class="px-2.5 py-1 bg-white border border-amber-300 text-amber-900 rounded-lg text-xs font-bold">Avant que (+ ne)</span>
                                            <span class="px-2.5 py-1 bg-white border border-amber-300 text-amber-900 rounded-lg text-xs font-bold">Jusqu'à ce que</span>
                                            <span class="px-2.5 py-1 bg-white border border-amber-300 text-amber-900 rounded-lg text-xs font-bold">En attendant que</span>
                                            <span class="px-2.5 py-1 bg-white border border-amber-300 text-amber-900 rounded-lg text-xs font-bold">D'ici à ce que</span>
                                        </div>
                                    </div>

                                    <div class="bg-amber-100/80 p-3 rounded-xl border border-amber-300">
                                        <span class="text-xs font-bold text-amber-900 flex items-center gap-1.5">
                                            <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> Mode du verbe :
                                        </span>
                                        <p class="text-base font-extrabold text-rose-600 mt-0.5">TOUJOURS LE SUBJONCTIF</p>
                                        <p class="text-[11px] text-amber-900">Car l'action de la subordonnée n'est pas encore réalisée (incertaine).</p>
                                    </div>
                                </div>
