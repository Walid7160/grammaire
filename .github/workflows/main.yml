                                <p class="text-sm font-semibold text-slate-800">1. Quelle question pose-t-on pour trouver les éléments soulignés ?</p>
                                <div id="ans-1" class="hidden mt-2 text-xs bg-emerald-50 text-emerald-800 p-2 rounded border border-emerald-200 font-medium">
                                    <i class="fa-solid fa-check mr-1"></i> On pose la question <strong>« Quand ? »</strong> (ou « Pendant combien de temps ? »). Ce sont des Compléments Circonstanciels de Temps (CCT).
                                </div>
                                <button onclick="toggleElement('ans-1')" class="mt-2 text-xs text-primary font-bold hover:underline">Voir la réponse</button>
                            </div>

                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                                <p class="text-sm font-semibold text-slate-800">2. Ont-ils tous la même nature grammaticale ?</p>
                                <div id="ans-2" class="hidden mt-2 text-xs bg-emerald-50 text-emerald-800 p-2 rounded border border-emerald-200 font-medium">
                                    <i class="fa-solid fa-check mr-1"></i> Non ! Il y a un <strong>Groupe Nominal</strong> (À l'approche...), un <strong>Adverbe</strong> (tôt), un <strong>Groupe Infinitif</strong> (après avoir vérifié), et des <strong>Propositions Subordonnées</strong>.
                                </div>
                                <button onclick="toggleElement('ans-2')" class="mt-2 text-xs text-primary font-bold hover:underline">Voir la réponse</button>
                            </div>

                            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                                <p class="text-sm font-semibold text-slate-800">3. Observe les verbes « révisais » et « tombe ». Sont-ils au même mode ?</p>
                                <div id="ans-3" class="hidden mt-2 text-xs bg-emerald-50 text-emerald-800 p-2 rounded border border-emerald-200 font-medium">
                                    <i class="fa-solid fa-check mr-1"></i> « révisais » est à l'<strong>Indicatif</strong> (après *pendant que*), tandis que « tombe » est au <strong>Subjonctif</strong> (après *avant que*).
                                </div>
                                <button onclick="toggleElement('ans-3')" class="mt-2 text-xs text-primary font-bold hover:underline">Voir la réponse</button>
                            </div>
                        </div>
                    </div>
