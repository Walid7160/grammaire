                <div class="absolute -top-24 -right-24 w-64 h-64 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-secondary/20 rounded-full blur-3xl pointer-events-none"></div>

                <div class="relative z-10">
                    <!-- Header -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-800 pb-6 mb-8">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 border border-emerald-400/30 text-emerald-400 flex items-center justify-center text-2xl shadow-lg">
                                <i class="fa-solid fa-graduation-cap"></i>
                            </div>
                            <div>
                                <span class="text-xs font-bold uppercase tracking-widest text-emerald-400">Test Bilan • 9ème Année</span>
                                <h2 class="font-heading text-2xl sm:text-3xl font-extrabold">4. Auto-évaluation Finale</h2>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 bg-slate-800/80 px-4 py-2.5 rounded-2xl border border-slate-700">
                            <div class="text-right">
                                <span class="text-[11px] text-slate-400 block">Note estimée</span>
                                <span id="quiz-live-status" class="font-heading font-bold text-lg text-amber-400">En cours...</span>
                            </div>
                            <div class="h-8 w-px bg-slate-700"></div>
                            <div>
                                <span class="text-[11px] text-slate-400 block">Question</span>
                                <span id="quiz-progress-text" class="font-heading font-bold text-lg text-white">1 / 10</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quiz Container -->
                    <div id="quiz-box" class="max-w-3xl mx-auto">
                        <!-- Progress bar -->
                        <div class="w-full h-2 bg-slate-800 rounded-full mb-6 overflow-hidden">
                            <div id="quiz-progress-bar" class="h-full bg-gradient-to-r from-emerald-400 to-sky-400 transition-all duration-300" style="width: 10%"></div>
