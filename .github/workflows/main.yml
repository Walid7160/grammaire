                        <!-- Question Card -->
                        <div id="quiz-question-card" class="bg-slate-800/90 backdrop-blur border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-xl">
                            <span id="q-category" class="inline-block px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-bold mb-3 border border-indigo-500/30">Catégorie</span>
                            <h3 id="q-text" class="font-heading text-lg sm:text-xl font-bold text-white mb-6 leading-snug">Chargement de la question...</h3>
                            
                            <div id="q-options" class="space-y-3">
                                <!-- Options injected via JS -->
                            </div>

                            <!-- Explanation Feedback -->
                            <div id="q-feedback" class="hidden mt-6 p-4 rounded-xl border text-sm"></div>

                            <!-- Navigation -->
                            <div class="mt-8 pt-4 border-t border-slate-700/80 flex justify-between items-center">
                                <span class="text-xs text-slate-400"><i class="fa-solid fa-shield-halved mr-1"></i> Sélectionne une réponse pour continuer</span>
                                <button id="btn-next-q" onclick="nextQuizQuestion()" class="hidden px-6 py-2.5 rounded-xl bg-gradient-to-r from-primary to-secondary hover:opacity-95 text-white font-bold text-sm shadow-lg transition-all flex items-center gap-2">
                                    Question suivante <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Final Results Screen (Hidden initially) -->
                        <div id="quiz-results" class="hidden bg-slate-800/90 backdrop-blur border border-slate-700 rounded-2xl p-8 text-center shadow-xl space-y-6">
                            <div id="result-icon" class="w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl shadow-lg"></div>
                            <div>
                                <span class="text-xs uppercase tracking-widest text-slate-400 font-bold">Ton résultat final</span>
                                <h3 id="result-title" class="font-heading text-3xl font-extrabold text-white mt-1">Bravo !</h3>
                                <div class="text-5xl font-heading font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-emerald-300 to-sky-400 my-4" id="result-score">
                                    18 / 20
                                </div>
                                <p id="result-message" class="text-slate-300 text-sm max-w-md mx-auto leading-relaxed"></p>
                            </div>

                            <!-- Detailed Competency Breakdown -->
                            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-700/80 max-w-md mx-auto text-left space-y-2 text-xs">
                                <span class="font-bold text-slate-300 block mb-2">Bilan de tes compétences :</span>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Identification des rapports temporels :</span>
                                    <span id="comp-rapports" class="font-bold text-emerald-400">Acquis</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Maîtrise de l'Indicatif / Subjonctif :</span>
                                    <span id="comp-modes" class="font-bold text-emerald-400">Acquis</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-slate-400">Transformations (Infinitif / GN) :</span>
                                    <span id="comp-transfo" class="font-bold text-emerald-400">Acquis</span>
                                </div>
                            </div>

                            <div class="pt-4 flex justify-center gap-4">
                                <button onclick="restartQuiz()" class="px-6 py-3 rounded-xl bg-primary hover:bg-indigo-500 text-white font-bold text-sm shadow-lg transition-all flex items-center gap-2">
                                    <i class="fa-solid fa-rotate-right"></i> Refaire le test
                                </button>
                                <a href="#synthese" class="px-6 py-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm transition-all flex items-center gap-2">
                                    Voir la fiche résumé <i class="fa-solid fa-arrow-down"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 5 : FICHE SYNTHÈSE (AIDE-MÉMOIRE) -->
        <section id="synthese" class="scroll-mt-24">
            <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center font-bold text-lg shadow-sm">
                        <i class="fa-solid fa-sitemap"></i>
                    </div>
                    <div>
                        <h2 class="font-heading text-2xl font-bold text-slate-900">5. Fiche Synthèse (Aide-mémoire pour l'examen)</h2>
                        <p class="text-sm text-slate-500">Tout ce qu'il faut retenir en un coup d'œil avant le devoir.</p>
                    </div>
                </div>
                <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold text-xs shadow-sm flex items-center gap-2 transition-all">
                    <i class="fa-solid fa-print text-primary"></i> Imprimer la fiche
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-md border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-white text-xs uppercase tracking-wider">
                                <th class="p-4 font-bold">Rapport de temps</th>
                                <th class="p-4 font-bold">Subordonnée Conjonctive (Sujets différents ou mêmes sujets)</th>
                                <th class="p-4 font-bold">Mode du verbe</th>
                                <th class="p-4 font-bold">Équivalent Infinitif / Gérondif (Même sujet obligatoire)</th>
                                <th class="p-4 font-bold">Préposition + GN</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-200 text-xs sm:text-sm">
                            <!-- Simultanéité -->
                            <tr class="hover:bg-sky-50/40 transition-colors">
                                <td class="p-4 font-bold text-sky-700 bg-sky-50/50">
                                    <i class="fa-solid fa-equals mr-1.5"></i> Simultanéité<br>
                                    <span class="text-[11px] font-normal text-slate-500">(En même temps)</span>
                                </td>
                                <td class="p-4">
                                    <span class="font-semibold text-slate-800">Quand, lorsque, pendant que, tandis que, au moment où, comme, à mesure que...</span>
                                </td>
                                <td class="p-4">
                                    <span class="px-2.5 py-1 rounded-full bg-sky-100 text-sky-800 font-bold text-xs">INDICATIF</span>
                                </td>
                                <td class="p-4 text-slate-700">
                                    • <strong>Au moment de</strong> + Inf. présent<br>
                                    • <strong>En</strong> + Participe présent (Gérondif)
                                </td>
                                <td class="p-4 text-slate-700">
                                    <strong>Pendant, durant, lors de, à</strong> + Groupe Nominal
                                </td>
                            </tr>
                            <!-- Antériorité -->
                            <tr class="hover:bg-emerald-50/40 transition-colors">
                                <td class="p-4 font-bold text-emerald-700 bg-emerald-50/50">
                                    <i class="fa-solid fa-forward-step mr-1.5"></i> Antériorité<br>
                                    <span class="text-[11px] font-normal text-slate-500">(Principale APRÈS)</span>
                                </td>
                                <td class="p-4">
                                    <span class="font-semibold text-slate-800">Après que, dès que, aussitôt que, une fois que, depuis que...</span>
                                </td>
                                <td class="p-4">
                                    <span class="px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold text-xs">INDICATIF</span>
                                </td>
                                <td class="p-4 text-slate-700">
                                    • <strong>Après</strong> + Infinitif <u>PASSÉ</u><br>
                                    <span class="text-[11px] text-slate-500 italic">(Ex: Après être sorti / Après avoir lu)</span>
                                </td>
                                <td class="p-4 text-slate-700">
                                    <strong>Après, dès, depuis</strong> + Groupe Nominal
                                </td>
                            </tr>
                            <!-- Postériorité -->
                            <tr class="hover:bg-amber-50/40 transition-colors">
                                <td class="p-4 font-bold text-amber-700 bg-amber-50/50">
                                    <i class="fa-solid fa-backward-step mr-1.5"></i> Postériorité<br>
                                    <span class="text-[11px] font-normal text-slate-500">(Principale AVANT)</span>
                                </td>
                                <td class="p-4">
                                    <span class="font-semibold text-slate-800">Avant que (+ ne), jusqu'à ce que, en attendant que...</span>
                                </td>
                                <td class="p-4">
                                    <span class="px-2.5 py-1 rounded-full bg-rose-100 text-rose-700 font-bold text-xs">SUBJONCTIF</span>
                                </td>
                                <td class="p-4 text-slate-700">
                                    • <strong>Avant de</strong> + Inf. présent<br>
                                    • <strong>En attendant de</strong> + Inf. présent
                                </td>
                                <td class="p-4 text-slate-700">
                                    <strong>Avant, jusqu'à, en attendant</strong> + Groupe Nominal
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4 text-xs">
            <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-lg bg-primary text-white flex items-center justify-center font-bold">9</span>
                <span class="font-bold text-slate-200">Portail Pédagogique - 9ème Année de Base (Tunisie)</span>
            </div>
            <div>Conçu pour la réussite au Diplôme de Fin d'Études de l'Enseignement de Base • Module de Grammaire</div>
        </div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- GLOBAL SCORE & PROGRESS ---
        let globalScore = 0;
        let completedExercises = new Set();

        function addPoints(points, exerciseId) {
            if (!completedExercises.has(exerciseId)) {
                globalScore += points;
                completedExercises.add(exerciseId);
                const scoreEl = document.getElementById('global-score');
                scoreEl.innerText = globalScore;
                scoreEl.classList.add('scale-125', 'text-amber-500');
                setTimeout(() => scoreEl.classList.remove('scale-125', 'text-amber-500'), 400);
            }
        }

        // Scroll Progress Bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('scroll-progress').style.width = scrolled + '%';
        });

        // --- SECTION 1 : OBSERVATION INTERACTIVITY ---
        function highlightText(mode) {
            const elements = document.querySelectorAll('.time-element');
            const verbs = document.querySelectorAll('.verb-element');
            
            if (mode === 'all') {
                elements.forEach(el => {
                    el.classList.add('highlight-sub');
                    el.classList.remove('border-b-2', 'border-dashed', 'border-slate-400');
                });
                verbs.forEach(v => v.classList.add('highlight-verb'));
            } else {
                elements.forEach(el => {
                    el.classList.remove('highlight-sub');
                    el.classList.add('border-b-2', 'border-dashed', 'border-slate-400');
                });
                verbs.forEach(v => v.classList.remove('highlight-verb'));
            }
        }

        function toggleElement(id) {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        }

        // --- SECTION 2 : COURSE TABS ---
        function switchCourseTab(tabId) {
            document.querySelectorAll('.course-tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');

            document.querySelectorAll('.course-tab-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                btn.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('bg-white', 'text-primary', 'shadow-sm');
            activeBtn.classList.remove('text-slate-600');
        }

        // --- SECTION 3 : EXERCISES DATA & RENDERING ---

        // Exercice 1 : Rapports de temps
        const ex1Data = [
            { id: 1, text: "<u>Avant que le professeur n'entre</u>, les élèves se mettent en rang.", answer: "Postériorité", hint: "« Avant que » indique que l'action principale se passe AVANT la subordonnée." },
            { id: 2, text: "<u>Dès que l'arbitre a sifflé la fin du match</u>, les supporters ont applaudi.", answer: "Antériorité", hint: "« Dès que » indique que l'action principale se passe APRÈS la subordonnée." },
            { id: 3, text: "<u>Tandis que tu regardais la télévision</u>, je préparais mon exposé.", answer: "Simultanéité", hint: "« Tandis que » indique deux actions qui se déroulent en même temps." },
            { id: 4, text: "Nous attendrons sous le préau <u>jusqu'à ce que la pluie cesse</u>.", answer: "Postériorité", hint: "« Jusqu'à ce que » marque la limite future d'une action (Postériorité)." },
            { id: 5, text: "<u>Après qu'il a obtenu son diplôme</u>, il a choisi le lycée pilote.", answer: "Antériorité", hint: "« Après que » exprime l'antériorité de la subordonnée." }
        ];

        function renderEx1() {
            const container = document.getElementById('ex1-container');
            container.innerHTML = ex1Data.map((item, idx) => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm space-y-2" id="ex1-row-${idx}">
                    <p class="text-slate-800 font-medium">${idx + 1}. ${item.text}</p>
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <select id="ex1-sel-${idx}" class="bg-white border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-semibold text-slate-700 focus:outline-none focus:border-primary">
                            <option value="">-- Choisir le rapport --</option>
                            <option value="Simultanéité">Simultanéité</option>
                            <option value="Antériorité">Antériorité</option>
                            <option value="Postériorité">Postériorité</option>
                        </select>
                        <span id="ex1-fb-${idx}" class="text-xs font-bold hidden"></span>
                    </div>
                </div>
            `).join('');
        }

        function checkEx1() {
            let score = 0;
            ex1Data.forEach((item, idx) => {
                const sel = document.getElementById(`ex1-sel-${idx}`);
                const fb = document.getElementById(`ex1-fb-${idx}`);
                const row = document.getElementById(`ex1-row-${idx}`);
                fb.classList.remove('hidden');

                if (sel.value === item.answer) {
                    score++;
                    row.className = "p-3 rounded-xl bg-emerald-50/60 border border-emerald-200 text-xs sm:text-sm space-y-2";
                    fb.className = "text-xs font-bold text-emerald-600";
                    fb.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Bravo !`;
                } else {
                    row.className = "p-3 rounded-xl bg-rose-50/60 border border-rose-200 text-xs sm:text-sm space-y-2";
                    fb.className = "text-xs font-bold text-rose-600";
                    fb.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i> Réponse : ${item.answer}`;
                }
            });
            document.getElementById('ex1-score').innerText = `Score : ${score}/${ex1Data.length}`;
            if (score === ex1Data.length) addPoints(20, 'ex1');
        }

        function resetEx1() {
            renderEx1();
            document.getElementById('ex1-score').innerText = `Score : 0/${ex1Data.length}`;
        }

        // Exercice 2 : Modes et Temps
        const ex2Data = [
            { id: 1, prefix: "Dépêchons-nous de rentrer avant que l'orage n'", options: ["éclate (Subjonctif)", "éclatera (Indicatif)", "éclater (Infinitif)"], answer: "éclate (Subjonctif)", rule: "« Avant que » est toujours suivi du Subjonctif." },
            { id: 2, prefix: "Après que les élèves ", suffix: " le texte, ils répondent aux questions.", options: ["aient lu (Subjonctif)", "ont lu (Indicatif)", "avoir lu (Infinitif)"], answer: "ont lu (Indicatif)", rule: "Attention au piège ! « Après que » est toujours suivi de l'Indicatif." },
            { id: 3, prefix: "Il vérifie toujours ses réponses avant de ", suffix: " sa copie.", options: ["rend (Indicatif)", "rende (Subjonctif)", "rendre (Infinitif)"], answer: "rendre (Infinitif)", rule: "Après la préposition « avant de », le verbe se met à l'Infinitif présent." },
            { id: 4, prefix: "Patientez dans la salle d'attente jusqu'à ce que le médecin vous ", suffix: ".", options: ["reçoit (Indicatif)", "reçoive (Subjonctif)", "recevoir (Infinitif)"], answer: "reçoive (Subjonctif)", rule: "« Jusqu'à ce que » exige le mode Subjonctif." },
            { id: 5, prefix: "Après ", suffix: " ses bagages, le voyageur s'est dirigé vers le quai.", options: ["avoir préparé (Inf. passé)", "préparer (Inf. présent)", "qu'il prépare (Subj.)"], answer: "avoir préparé (Inf. passé)", rule: "La préposition « Après » est suivie de l'Infinitif Passé." }
        ];

        function renderEx2() {
            const container = document.getElementById('ex2-container');
            container.innerHTML = ex2Data.map((item, idx) => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm space-y-2" id="ex2-row-${idx}">
                    <p class="text-slate-800 font-medium leading-relaxed">
                        ${idx + 1}. ${item.prefix}
                        <select id="ex2-sel-${idx}" class="bg-white border border-indigo-300 rounded-lg px-2 py-1 text-xs font-bold text-primary focus:outline-none focus:ring-2 focus:ring-primary mx-1">
                            <option value="">-- ? --</option>
                            ${item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                        ${item.suffix || ''}
                    </p>
                    <div id="ex2-fb-${idx}" class="text-xs hidden"></div>
                </div>
            `).join('');
        }

        function checkEx2() {
            let score = 0;
            ex2Data.forEach((item, idx) => {
                const sel = document.getElementById(`ex2-sel-${idx}`);
                const fb = document.getElementById(`ex2-fb-${idx}`);
                const row = document.getElementById(`ex2-row-${idx}`);
                fb.classList.remove('hidden');

                if (sel.value === item.answer) {
                    score++;
                    row.className = "p-3 rounded-xl bg-emerald-50/60 border border-emerald-200 text-xs sm:text-sm space-y-2";
                    fb.className = "text-xs font-semibold text-emerald-700";
                    fb.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Correct ! ${item.rule}`;
                } else {
                    row.className = "p-3 rounded-xl bg-rose-50/60 border border-rose-200 text-xs sm:text-sm space-y-2";
                    fb.className = "text-xs font-semibold text-rose-700";
                    fb.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i> Faux. Il fallait choisir <strong>${item.answer}</strong>. (${item.rule})`;
                }
            });
            document.getElementById('ex2-score').innerText = `Score : ${score}/${ex2Data.length}`;
            if (score === ex2Data.length) addPoints(20, 'ex2');
        }

        function resetEx2() {
            renderEx2();
            document.getElementById('ex2-score').innerText = `Score : 0/${ex2Data.length}`;
        }

        // Exercice 3 : Natures grammaticales
        const ex3Data = [
            { id: 1, text: "<u>Au coucher du soleil</u>, les pêcheurs rentrent au port de Sfax.", answer: "Groupe Nominal prépositionnel" },
            { id: 2, text: "Elle a compris son erreur <u>en relisant son brouillon</u>.", answer: "Gérondif" },
            { id: 3, text: "<u>Autrefois</u>, les gens voyageaient en calèche.", answer: "Adverbe" },
            { id: 4, text: "N'oublie pas d'éteindre la lumière <u>avant de quitter la chambre</u>.", answer: "Groupe Infinitif prépositionnel" },
            { id: 5, text: "<u>Lorsque le printemps arrive</u>, les orangers du Cap Bon fleurissent.", answer: "Proposition Subordonnée Conjonctive" }
        ];

        const naturesOptions = [
            "Groupe Nominal prépositionnel",
            "Adverbe",
            "Groupe Infinitif prépositionnel",
            "Gérondif",
            "Proposition Subordonnée Conjonctive"
        ];

        function renderEx3() {
            const container = document.getElementById('ex3-container');
            container.innerHTML = ex3Data.map((item, idx) => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm space-y-2" id="ex3-row-${idx}">
                    <p class="text-slate-800 font-medium">${idx + 1}. ${item.text}</p>
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <select id="ex3-sel-${idx}" class="bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-semibold text-slate-700 focus:outline-none focus:border-primary">
                            <option value="">-- Choisir la nature grammaticale --</option>
                            ${naturesOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                        </select>
                        <span id="ex3-fb-${idx}" class="text-xs font-bold hidden"></span>
                    </div>
                </div>
            `).join('');
        }

        function checkEx3() {
            let score = 0;
            ex3Data.forEach((item, idx) => {
                const sel = document.getElementById(`ex3-sel-${idx}`);
                const fb = document.getElementById(`ex3-fb-${idx}`);
                const row = document.getElementById(`ex3-row-${idx}`);
                fb.classList.remove('hidden');

                if (sel.value === item.answer) {
                    score++;
                    row.className = "p-3 rounded-xl bg-emerald-50/60 border border-emerald-200 text-xs sm:text-sm space-y-2";
                    fb.className = "text-xs font-bold text-emerald-600";
                    fb.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Exact !`;
                } else {
                    row.className = "p-3 rounded-xl bg-rose-50/60 border border-rose-200 text-xs sm:text-sm space-y-2";
                    fb.className = "text-xs font-bold text-rose-600";
                    fb.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i> C'est un(e) : ${item.answer}`;
                }
            });
            document.getElementById('ex3-score').innerText = `Score : ${score}/${ex3Data.length}`;
            if (score === ex3Data.length) addPoints(20, 'ex3');
        }

        function resetEx3() {
            renderEx3();
            document.getElementById('ex3-score').innerText = `Score : 0/${ex3Data.length}`;
        }

        // Exercice 4 : Transformations
        const ex4Data = [
            {
                id: 1,
                consigne: "Remplace le GN souligné par une proposition subordonnée de même sens :",
                phrase: "<u>À l'arrivée du directeur</u>, tout le monde s'est tu.",
                options: [
                    "Quand le directeur est arrivé, tout le monde s'est tu.",
                    "Avant que le directeur n'arrive, tout le monde s'est tu.",
                    "En arrivant, tout le monde s'est tu."
                ],
                answer: "Quand le directeur est arrivé, tout le monde s'est tu."
            },
            {
                id: 2,
                consigne: "Remplace la subordonnée par un groupe infinitif (même sujet) :",
                phrase: "Sami révise bien ses leçons <u>avant qu'il ne passe son examen</u>.",
                options: [
                    "Sami révise bien ses leçons après avoir passé son examen.",
                    "Sami révise bien ses leçons avant de passer son examen.",
                    "Sami révise bien ses leçons au moment de passer son examen."
                ],
                answer: "Sami révise bien ses leçons avant de passer son examen."
            },
            {
                id: 3,
                consigne: "Transforme la subordonnée en Groupe Nominal prépositionnel (Nominalisation) :",
                phrase: "Nous sommes rentrés à la maison <u>après que le film s'est terminé</u>.",
                options: [
                    "Nous sommes rentrés à la maison avant la fin du film.",
                    "Nous sommes rentrés à la maison après la fin du film.",
                    "Nous sommes rentrés à la maison pendant le film."
                ],
                answer: "Nous sommes rentrés à la maison après la fin du film."
            },
            {
                id: 4,
                consigne: "Relie ces deux phrases pour exprimer la postériorité avec « jusqu'à ce que » :",
                phrase: "L'athlète s'entraîne dur. Il battra le record.",
                options: [
                    "L'athlète s'entraîne dur jusqu'à ce qu'il battra le record.",
                    "L'athlète s'entraîne dur jusqu'à ce qu'il batte le record.",
                    "L'athlète s'entraîne dur jusqu'à battre le record."
                ],
                answer: "L'athlète s'entraîne dur jusqu'à ce qu'il batte le record."
            }
        ];

        function renderEx4() {
            const container = document.getElementById('ex4-container');
            container.innerHTML = ex4Data.map((item, idx) => `
                <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2" id="ex4-row-${idx}">
                    <span class="font-bold text-indigo-600 block">${idx + 1}. ${item.consigne}</span>
                    <p class="text-slate-800 font-semibold bg-white p-2 rounded border border-slate-200">« ${item.phrase} »</p>
                    <select id="ex4-sel-${idx}" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-2 text-xs font-semibold text-slate-700 focus:outline-none focus:border-primary">
                        <option value="">-- Choisis la bonne transformation --</option>
                        ${item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                    </select>
                    <div id="ex4-fb-${idx}" class="text-xs font-bold hidden"></div>
                </div>
            `).join('');
        }

        function checkEx4() {
            let score = 0;
            ex4Data.forEach((item, idx) => {
                const sel = document.getElementById(`ex4-sel-${idx}`);
                const fb = document.getElementById(`ex4-fb-${idx}`);
                const row = document.getElementById(`ex4-row-${idx}`);
                fb.classList.remove('hidden');

                if (sel.value === item.answer) {
                    score++;
                    row.className = "p-3 rounded-xl bg-emerald-50/60 border border-emerald-200 text-xs space-y-2";
                    fb.className = "text-xs font-bold text-emerald-600";
                    fb.innerHTML = `<i class="fa-solid fa-check mr-1"></i> Transformation parfaite !`;
                } else {
                    row.className = "p-3 rounded-xl bg-rose-50/60 border border-rose-200 text-xs space-y-2";
                    fb.className = "text-xs font-bold text-rose-600";
                    fb.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i> Attendu : « ${item.answer} »`;
                }
            });
            document.getElementById('ex4-score').innerText = `Score : ${score}/${ex4Data.length}`;
            if (score === ex4Data.length) addPoints(20, 'ex4');
        }

        function resetEx4() {
            renderEx4();
            document.getElementById('ex4-score').innerText = `Score : 0/${ex4Data.length}`;
        }

        // --- SECTION 4 : AUTO-ÉVALUATION (10 QUESTIONS QCM) ---
        const quizQuestions = [
            {
                category: "Modes & Conjonctions",
                comp: "modes",
                question: "Complète : « Après que nous _________ nos bagages, nous avons pris le taxi. »",
                options: [
                    "ayons descendu (Subjonctif passé)",
                    "avons descendu (Indicatif passé composé)",
                    "avoir descendu (Infinitif passé)",
                    "descendions (Indicatif imparfait)"
                ],
                correct: 1,
                explanation: "Règle d'or : La conjonction « Après que » exprime un fait accompli (antériorité) et est TOUJOURS suivie du mode Indicatif."
            },
            {
                category: "Rapport Temporel",
                comp: "rapports",
                question: "Quel rapport exprime la phrase : « Range ta chambre avant que tes invités n'arrivent. » ?",
                options: [
                    "La simultanéité",
                    "L'antériorité",
                    "La postériorité",
                    "L'habitude"
                ],
                correct: 2,
                explanation: "L'action principale (ranger) se déroule AVANT l'action de la subordonnée (arriver). « Avant que » introduit un rapport de postériorité."
            },
            {
                category: "Modes & Conjonctions",
                comp: "modes",
                question: "Complète : « Reste concentré jusqu'à ce que l'épreuve _________ totalement terminée. »",
                options: [
                    "est (Indicatif présent)",
                    "sera (Indicatif futur)",
                    "soit (Subjonctif présent)",
                    "être (Infinitif)"
                ],
                correct: 2,
                explanation: "« Jusqu'à ce que » est une locution conjonctive qui exige toujours l'emploi du mode Subjonctif."
            },
            {
                category: "Transformation (Même sujet)",
                comp: "transfo",
                question: "Comment corriger cette phrase maladroite : « Il se lave les mains avant qu'il ne mange » ?",
                options: [
                    "Il se lave les mains avant qu'il mange.",
                    "Il se lave les mains avant de manger.",
                    "Il se lave les mains après avoir mangé.",
                    "Il se lave les mains en mangeant."
                ],
                correct: 1,
                explanation: "Quand les deux verbes ont le même sujet (Il / il), on remplace « avant que + subjonctif » par « avant de + infinitif présent »."
            },
            {
                category: "Nature Grammaticale",
                comp: "transfo",
                question: "Quelle est la nature du CCT dans : « Le soleil levé, la caravane reprit sa marche dans le désert. » ?",
                options: [
                    "Groupe Nominal prépositionnel",
                    "Proposition subordonnée conjonctive",
                    "Proposition subordonnée participiale",
                    "Gérondif"
                ],
                correct: 2,
                explanation: "« Le soleil levé » possède son propre sujet (le soleil) et un participe passé (levé) sans conjonction : c'est une proposition subordonnée participiale."
            },
            {
                category: "Simultanéité",
                comp: "rapports",
                question: "Laquelle de ces conjonctions exprime la simultanéité (deux actions en même temps) ?",
                options: [
                    "Aussitôt que",
                    "En attendant que",
                    "Au fur et à mesure que",
                    "Une fois que"
                ],
                correct: 2,
                explanation: "« Au fur et à mesure que » exprime une simultanéité progressive (comme « pendant que » ou « tandis que »)."
            },
            {
                category: "Groupe Infinitif",
                comp: "modes",
                question: "Complète : « Après _________ à Kairouan, les touristes ont visité El Jem. »",
                options: [
                    "être allés",
                    "avoir allé",
                    "aller",
                    "étant allés"
                ],
                correct: 0,
                explanation: "La préposition « Après » est suivie de l'infinitif passé. Le verbe « aller » se conjugue avec l'auxiliaire être : « Après être allés »."
            },
            {
                category: "Nominalisation",
                comp: "transfo",
                question: "Transforme la subordonnée en GN : « Dès que le printemps débute, les hirondelles reviennent. »",
                options: [
                    "Avant le début du printemps, les hirondelles reviennent.",
                    "Dès le début du printemps, les hirondelles reviennent.",
                    "Pendant le printemps, les hirondelles reviennent.",
                    "En débutant le printemps, les hirondelles reviennent."
                ],
                correct: 1,
                explanation: "On garde l'idée d'antériorité immédiate (« Dès que » -> préposition « Dès ») et on nominalise le verbe « débuter » -> « le début »."
            },
            {
                category: "Gérondif",
                comp: "transfo",
                question: "Dans « Il a croisé son ami en sortant du stade », qui est le sujet implicite de « en sortant » ?",
                options: [
                    "Son ami",
                    "Il (le sujet de la phrase)",
                    "Le stade",
                    "On ne peut pas savoir"
                ],
                correct: 1,
                explanation: "Le gérondif (en + participe présent) dépend toujours du sujet du verbe principal (ici « Il »)."
            },
            {
                category: "Synthèse Bilan",
                comp: "modes",
                question: "Chasse l'intrus : Laquelle de ces conjonctions N'EST PAS suivie du subjonctif ?",
                options: [
                    "Avant que",
                    "Jusqu'à ce que",
                    "En attendant que",
                    "Depuis que"
                ],
                correct: 3,
                explanation: "« Depuis que » marque l'origine d'une action réelle dans le passé qui continue : elle est toujours suivie de l'INDICATIF !"
            }
        ];

        let currentQuizIdx = 0;
        let quizScore = 0;
        let compStats = { rapports: 0, modes: 0, transfo: 0 };
        let answeredCurrent = false;

        function loadQuizQuestion() {
            answeredCurrent = false;
            const q = quizQuestions[currentQuizIdx];
            document.getElementById('quiz-progress-text').innerText = `${currentQuizIdx + 1} / ${quizQuestions.length}`;
            document.getElementById('quiz-progress-bar').style.width = `${((currentQuizIdx + 1) / quizQuestions.length) * 100}%`;
            
            document.getElementById('q-category').innerText = q.category;
            document.getElementById('q-text').innerText = `${currentQuizIdx + 1}. ${q.question}`;
            
            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = q.options.map((opt, idx) => `
                <button onclick="selectQuizOption(${idx})" id="q-opt-${idx}" class="w-full text-left p-4 rounded-xl bg-slate-700/60 hover:bg-slate-700 border border-slate-600 text-slate-200 font-semibold text-sm transition-all flex items-center justify-between group">
                    <span><span class="inline-block w-6 h-6 rounded-lg bg-slate-800 text-slate-400 text-xs font-bold text-center leading-6 mr-3 group-hover:bg-primary group-hover:text-white transition-colors">${String.fromCharCode(65 + idx)}</span> ${opt}</span>
                    <i id="q-icon-${idx}" class="fa-solid fa-circle-check opacity-0 transition-opacity"></i>
                </button>
            `).join('');

            document.getElementById('q-feedback').classList.add('hidden');
            document.getElementById('btn-next-q').classList.add('hidden');
        }

        function selectQuizOption(selectedIdx) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const q = quizQuestions[currentQuizIdx];
            const fb = document.getElementById('q-feedback');
            fb.classList.remove('hidden');

            q.options.forEach((_, idx) => {
                const btn = document.getElementById(`q-opt-${idx}`);
                const icon = document.getElementById(`q-icon-${idx}`);
                btn.disabled = true;

                if (idx === q.correct) {
                    btn.className = "w-full text-left p-4 rounded-xl bg-emerald-500/20 border-2 border-emerald-400 text-emerald-200 font-bold text-sm flex items-center justify-between";
                    icon.className = "fa-solid fa-circle-check text-emerald-400 opacity-100 text-lg";
                } else if (idx === selectedIdx && selectedIdx !== q.correct) {
                    btn.className = "w-full text-left p-4 rounded-xl bg-rose-500/20 border-2 border-rose-400 text-rose-200 font-bold text-sm flex items-center justify-between";
                    icon.className = "fa-solid fa-circle-xmark text-rose-400 opacity-100 text-lg";
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            if (selectedIdx === q.correct) {
                quizScore += 2; // 2 points per question -> /20
                compStats[q.comp]++;
                fb.className = "mt-6 p-4 rounded-xl bg-emerald-950/80 border border-emerald-500/40 text-emerald-200 text-xs sm:text-sm";
                fb.innerHTML = `<strong class="text-emerald-400 block mb-1"><i class="fa-solid fa-check-double mr-1"></i> Excellente réponse ! (+2 pts)</strong> ${q.explanation}`;
            } else {
                fb.className = "mt-6 p-4 rounded-xl bg-rose-950/80 border border-rose-500/40 text-rose-200 text-xs sm:text-sm";
                fb.innerHTML = `<strong class="text-rose-400 block mb-1"><i class="fa-solid fa-circle-exclamation mr-1"></i> Réponse incorrecte.</strong> ${q.explanation}`;
            }

            document.getElementById('quiz-live-status').innerText = `${quizScore} / 20`;
            const nextBtn = document.getElementById('btn-next-q');
            nextBtn.classList.remove('hidden');
            nextBtn.innerHTML = currentQuizIdx === quizQuestions.length - 1 
                ? `Voir mon bilan final <i class="fa-solid fa-flag-checkered"></i>` 
                : `Question suivante <i class="fa-solid fa-arrow-right"></i>`;
        }

        function nextQuizQuestion() {
            if (currentQuizIdx < quizQuestions.length - 1) {
                currentQuizIdx++;
                loadQuizQuestion();
            } else {
                showQuizResults();
            }
        }

        function showQuizResults() {
            document.getElementById('quiz-question-card').classList.add('hidden');
            const resBox = document.getElementById('quiz-results');
            resBox.classList.remove('hidden');

            document.getElementById('result-score').innerText = `${quizScore} / 20`;
            addPoints(quizScore * 2, 'final-quiz');

            const iconEl = document.getElementById('result-icon');
            const titleEl = document.getElementById('result-title');
            const msgEl = document.getElementById('result-message');

            if (quizScore >= 16) {
                iconEl.className = "w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl shadow-lg bg-emerald-500/20 text-emerald-400 border border-emerald-400/40";
                iconEl.innerHTML = `<i class="fa-solid fa-trophy"></i>`;
                titleEl.innerText = "Excellence ! Tu es prêt(e) pour l'examen !";
                msgEl.innerText = "Tu maîtrises parfaitement l'expression du temps, les nuances entre l'indicatif et le subjonctif ainsi que les transformations grammaticales de 9ème année.";
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                }
            } else if (quizScore >= 10) {
                iconEl.className = "w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl shadow-lg bg-amber-500/20 text-amber-400 border border-amber-400/40";
                iconEl.innerHTML = `<i class="fa-solid fa-thumbs-up"></i>`;
                titleEl.innerText = "Bon travail, mais tu peux viser plus haut !";
                msgEl.innerText = "Les bases sont acquises, mais attention aux petits pièges comme « après que + indicatif » ou les transformations avec l'infinitif. Relis la fiche synthèse !";
            } else {
                iconEl.className = "w-20 h-20 rounded-full mx-auto flex items-center justify-center text-4xl shadow-lg bg-rose-500/20 text-rose-400 border border-rose-400/40";
                iconEl.innerHTML = `<i class="fa-solid fa-book-open-reader"></i>`;
                titleEl.innerText = "Courage, révise encore un peu le cours !";
                msgEl.innerText = "Ne te décourage pas ! Reprends le tableau des 3 rapports temporels dans la section 2 et refais les exercices d'entraînement avant de retenter le test.";
            }

            // Update competency badges
            document.getElementById('comp-rapports').innerText = compStats.rapports >= 1 ? "✅ Bien acquis" : "⚠️ À réviser";
            document.getElementById('comp-rapports').className = compStats.rapports >= 1 ? "font-bold text-emerald-400" : "font-bold text-amber-400";

            document.getElementById('comp-modes').innerText = compStats.modes >= 3 ? "✅ Bien acquis" : "⚠️ À réviser";
            document.getElementById('comp-modes').className = compStats.modes >= 3 ? "font-bold text-emerald-400" : "font-bold text-amber-400";

            document.getElementById('comp-transfo').innerText = compStats.transfo >= 3 ? "✅ Bien acquis" : "⚠️ À réviser";
            document.getElementById('comp-transfo').className = compStats.transfo >= 3 ? "font-bold text-emerald-400" : "font-bold text-amber-400";
        }

        function restartQuiz() {
            currentQuizIdx = 0;
            quizScore = 0;
            compStats = { rapports: 0, modes: 0, transfo: 0 };
            document.getElementById('quiz-live-status').innerText = "En cours...";
            document.getElementById('quiz-results').classList.add('hidden');
            document.getElementById('quiz-question-card').classList.remove('hidden');
            loadQuizQuestion();
        }

        // Initialize everything on DOM Load
        document.addEventListener('DOMContentLoaded', () => {
            renderEx1();
            renderEx2();
            renderEx3();
            renderEx4();
            loadQuizQuestion();
        });
    </script>
</body>
</html>
