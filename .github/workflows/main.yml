            <!-- TAB A: RAPPORTS DE TEMPS & MODES (Core of 9ème) -->
            <div id="tab-rapports" class="course-tab-content space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
                    <h3 class="font-heading font-bold text-lg text-slate-800 mb-2">Les 3 rapports chronologiques dans la phrase complexe</h3>
                    <p class="text-sm text-slate-600 mb-6">Quand une phrase contient une proposition principale et une proposition subordonnée de temps, l'action de la principale peut se dérouler <strong>en même temps</strong>, <strong>après</strong> ou <strong>avant</strong> l'action de la subordonnée.</p>

                    <div class="grid lg:grid-cols-3 gap-6">
                        
                        <!-- 1. SIMULTANÉITÉ -->
                        <div class="rounded-2xl border-2 border-sky-200 bg-sky-50/30 flex flex-col justify-between overflow-hidden shadow-sm hover:shadow-md transition-shadow">
                            <div>
                                <div class="bg-sky-500 text-white p-4 flex items-center justify-between">
                                    <div>
                                        <span class="text-xs uppercase tracking-wider font-semibold text-sky-100 block">Rapport 1</span>
                                        <h4 class="font-heading font-bold text-lg">La Simultanéité</h4>
                                    </div>
                                    <i class="fa-solid fa-equals text-2xl opacity-80"></i>
                                </div>
                                <div class="p-5 space-y-4">
                                    <div class="bg-white p-3 rounded-xl border border-sky-100 text-center">
                                        <span class="text-xs font-bold text-slate-500 block mb-1">Schéma temporel</span>
                                        <div class="flex items-center justify-center gap-2 text-xs font-bold text-sky-700">
                                            <span class="px-2 py-1 bg-sky-100 rounded">Action 1</span>
                                            <i class="fa-solid fa-arrows-left-right text-sky-500"></i>
                                            <span class="px-2 py-1 bg-sky-100 rounded">Action 2</span>
                                        </div>
                                        <span class="text-[11px] text-slate-500 mt-1 block">Les deux actions se passent en même temps.</span>
                                    </div>

                                    <div>
                                        <span class="text-xs font-bold uppercase text-slate-400 tracking-wider">Conjonctions (Outils) :</span>
                                        <div class="flex flex-wrap gap-1.5 mt-2">
                                            <span class="px-2.5 py-1 bg-white border border-sky-200 text-sky-800 rounded-lg text-xs font-semibold">Quand / Lorsque</span>
                                            <span class="px-2.5 py-1 bg-white border border-sky-200 text-sky-800 rounded-lg text-xs font-semibold">Pendant que</span>
                                            <span class="px-2.5 py-1 bg-white border border-sky-200 text-sky-800 rounded-lg text-xs font-semibold">Tandis que</span>
                                            <span class="px-2.5 py-1 bg-white border border-sky-200 text-sky-800 rounded-lg text-xs font-semibold">Au moment où</span>
                                            <span class="px-2.5 py-1 bg-white border border-sky-200 text-sky-800 rounded-lg text-xs font-semibold">Comme</span>
                                            <span class="px-2.5 py-1 bg-white border border-sky-200 text-sky-800 rounded-lg text-xs font-semibold">Chaque fois que</span>
                                        </div>
                                    </div>

                                    <div class="bg-sky-100/70 p-3 rounded-xl border border-sky-200">
                                        <span class="text-xs font-bold text-sky-900 flex items-center gap-1.5">
                                            <i class="fa-solid fa-key text-sky-600"></i> Mode du verbe :
                                        </span>
                                        <p class="text-base font-extrabold text-sky-700 mt-0.5">TOUJOURS L'INDICATIF</p>
                                        <p class="text-[11px] text-sky-800">L'action est présentée comme certaine/réelle.</p>
                                    </div>
                                </div>
                            </div>
                            <div class="p-4 bg-white border-t border-sky-100 text-xs space-y-1.5">
