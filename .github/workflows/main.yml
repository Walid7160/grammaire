                                <span class="font-bold text-slate-700 block">Exemples :</span>
                                <p class="text-slate-600">• Rentre à la maison <span class="highlight-conj">avant qu'</span>il (ne) <span class="highlight-verb">fasse</span> (Subj. Présent) nuit.</p>
                                <p class="text-slate-600">• Reste ici <span class="highlight-conj">jusqu'à ce que</span> je <span class="highlight-verb">revienne</span> (Subj. Présent).</p>
                            </div>
                        </div>

                    </div>
                </div>
