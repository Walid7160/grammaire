            <!-- TAB B: NATURES GRAMMATICALES -->
            <div id="tab-natures" class="course-tab-content hidden space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
                    <h3 class="font-heading font-bold text-lg text-slate-800 mb-2">Les différentes classes grammaticales du CCT</h3>
                    <p class="text-sm text-slate-600 mb-6">Dans la phrase simple ou complexe, le Complément Circonstanciel de Temps peut avoir plusieurs natures :</p>

                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-primary transition-all">
                            <div class="flex items-center gap-2.5 mb-2">
                                <span class="w-7 h-7 rounded-lg bg-indigo-100 text-primary font-bold text-xs flex items-center justify-center">1</span>
                                <h4 class="font-bold text-slate-800 text-sm">Groupe Nominal (prépositionnel ou non)</h4>
                            </div>
                            <p class="text-xs text-slate-600 mb-2">Introduit ou non par une préposition (à, dans, pendant, dès, depuis, avant...).</p>
                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-700 font-medium">
                                • <span class="highlight-sub">Ce matin</span>, j'ai un examen.<br>
                                • Il travaille <span class="highlight-sub">depuis l'aube</span>.
                            </div>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-primary transition-all">
                            <div class="flex items-center gap-2.5 mb-2">
                                <span class="w-7 h-7 rounded-lg bg-indigo-100 text-primary font-bold text-xs flex items-center justify-center">2</span>
                                <h4 class="font-bold text-slate-800 text-sm">Adverbe (ou locution adverbiale)</h4>
                            </div>
                            <p class="text-xs text-slate-600 mb-2">Mots invariables indiquant le moment ou la fréquence.</p>
                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-700 font-medium">
                                • Nous partirons <span class="highlight-sub">demain</span> / <span class="highlight-sub">tôt</span>.<br>
                                • Il révise <span class="highlight-sub">souvent</span> / <span class="highlight-sub">longtemps</span>.
                            </div>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-primary transition-all">
                            <div class="flex items-center gap-2.5 mb-2">
                                <span class="w-7 h-7 rounded-lg bg-indigo-100 text-primary font-bold text-xs flex items-center justify-center">3</span>
                                <h4 class="font-bold text-slate-800 text-sm">Groupe Infinitif (prépositionnel)</h4>
                            </div>
                            <p class="text-xs text-slate-600 mb-2">Introduit par : <em>avant de, au moment de, après (+ inf. passé)</em>.</p>
                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-700 font-medium">
                                • Réfléchis <span class="highlight-sub">avant de répondre</span>.<br>
                                • <span class="highlight-sub">Après avoir dîné</span>, il lit.
                            </div>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-primary transition-all">
                            <div class="flex items-center gap-2.5 mb-2">
                                <span class="w-7 h-7 rounded-lg bg-indigo-100 text-primary font-bold text-xs flex items-center justify-center">4</span>
                                <h4 class="font-bold text-slate-800 text-sm">Gérondif (En + Participe Présent)</h4>
                            </div>
                            <p class="text-xs text-slate-600 mb-2">Exprime la simultanéité (même sujet pour les deux verbes).</p>
                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-700 font-medium">
                                • Il écoute de la musique <span class="highlight-sub">en révisant</span>.<br>
                                • <span class="highlight-sub">En sortant du collège</span>, j'ai vu Sami.
                            </div>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 hover:border-primary transition-all sm:col-span-2">
                            <div class="flex items-center gap-2.5 mb-2">
                                <span class="w-7 h-7 rounded-lg bg-indigo-100 text-primary font-bold text-xs flex items-center justify-center">5</span>
                                <h4 class="font-bold text-slate-800 text-sm">Proposition Subordonnée Conjonctive (et Participiale)</h4>
                            </div>
                            <p class="text-xs text-slate-600 mb-2">Contient un verbe conjugué introduit par une conjonction de subordination, ou un participe ayant son propre sujet.</p>
                            <div class="grid sm:grid-cols-2 gap-2">
                                <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-700 font-medium">
                                    <strong>Sub. Conjonctive :</strong><br>
                                    <span class="highlight-sub">Quand la cloche sonne</span>, les élèves sortent.
                                </div>
                                <div class="bg-white p-2.5 rounded-lg border border-slate-200 text-xs text-slate-700 font-medium">
                                    <strong>Sub. Participiale :</strong><br>
                                    <span class="highlight-sub">L'orage calmé</span>, nous reprîmes la route.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB C: ASTUCES & TRANSFORMATIONS (Examen 9ème) -->
            <div id="tab-astuces" class="course-tab-content hidden space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Règle de l'infinitif (Même sujet) -->
                    <div class="bg-white rounded-2xl p-6 shadow-md border-l-4 border-l-primary border border-slate-200">
                        <div class="flex items-center gap-2 text-primary font-heading font-bold text-lg mb-3">
                            <i class="fa-solid fa-shuffle"></i>
                            <h3>Règle d'Or : Subordonnée vs Infinitif</h3>
                        </div>
                        <p class="text-sm text-slate-600 mb-4">
                            En français, lorsque les deux verbes ont le <strong>MÊME SUJET</strong>, on remplace souvent la proposition subordonnée par un <strong>groupe infinitif</strong> avec certaines conjonctions :
                        </p>
                        <div class="space-y-3 text-xs">
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-200">
                                <span class="font-bold text-rose-600 block mb-1"><i class="fa-solid fa-xmark mr-1"></i> Incorrect (Lourd) :</span>
                                <span class="line-through text-slate-500">Je me brosse les dents avant que je dorme.</span> (Même sujet : Je / je)
                                <span class="font-bold text-emerald-600 block mt-2 mb-1"><i class="fa-solid fa-check mr-1"></i> Correct (Infinitif) :</span>
                                <span class="text-slate-800 font-semibold">Je me brosse les dents <span class="highlight-conj">avant de</span> <span class="highlight-verb">dormir</span>.</span>
                            </div>

                            <div class="p-3 bg-indigo-50/60 rounded-xl border border-indigo-100 space-y-1.5">
                                <span class="font-bold text-indigo-900 block">Table de transformation (Même sujet) :</span>
                                <div class="flex justify-between items-center border-b border-indigo-100 pb-1">
                                    <span>Avant que (+ Subjonctif)</span>
                                    <i class="fa-solid fa-arrow-right text-indigo-400"></i>
                                    <span class="font-bold text-primary">Avant de + Infinitif présent</span>
                                </div>
                                <div class="flex justify-between items-center border-b border-indigo-100 pb-1">
                                    <span>En attendant que (+ Subj.)</span>
                                    <i class="fa-solid fa-arrow-right text-indigo-400"></i>
                                    <span class="font-bold text-primary">En attendant de + Infinitif</span>
                                </div>
                                <div class="flex justify-between items-center border-b border-indigo-100 pb-1">
                                    <span>Après que (+ Indicatif)</span>
                                    <i class="fa-solid fa-arrow-right text-indigo-400"></i>
                                    <span class="font-bold text-primary">Après + Infinitif PASSÉ</span>
                                </div>
                                <div class="flex justify-between items-center">
                                    <span>Pendant que (+ Indicatif)</span>
                                    <i class="fa-solid fa-arrow-right text-indigo-400"></i>
                                    <span class="font-bold text-primary">En + Participe Présent (Gérondif)</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Les Pièges classiques aux examens -->
                    <div class="bg-white rounded-2xl p-6 shadow-md border-l-4 border-l-tunisia border border-slate-200">
                        <div class="flex items-center gap-2 text-tunisia font-heading font-bold text-lg mb-3">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <h3>Attention aux pièges à l'examen !</h3>
                        </div>
                        <div class="space-y-4">
                            <div class="p-3.5 bg-rose-50/70 rounded-xl border border-rose-200">
                                <h4 class="font-bold text-rose-900 text-sm flex items-center gap-1.5">
                                    <span class="bg-rose-600 text-white text-[10px] px-1.5 py-0.5 rounded">Piège N°1</span>
                                    « Après que » + INDICATIF !
                                </h4>
                                <p class="text-xs text-rose-800 mt-1 leading-relaxed">
                                    Même si à l'oral beaucoup de gens utilisent le subjonctif, la règle grammaticale exige l'<strong>INDICATIF</strong> après « après que » car l'action est déjà accomplie (réelle) !
                                </p>
                                <div class="mt-2 bg-white p-2 rounded border border-rose-100 text-xs">
                                    ❌ Après qu'il <span class="line-through text-rose-500">soit parti</span>.<br>
                                    ✅ Après qu'il <strong class="text-emerald-600">est parti</strong> (Passé composé de l'indicatif).
                                </div>
                            </div>

                            <div class="p-3.5 bg-amber-50/70 rounded-xl border border-amber-200">
                                <h4 class="font-bold text-amber-900 text-sm flex items-center gap-1.5">
                                    <span class="bg-amber-600 text-white text-[10px] px-1.5 py-0.5 rounded">Piège N°2</span>
                                    La nominalisation (GN <i class="fa-solid fa-arrows-left-right text-xs"></i> Subordonnée)
                                </h4>
                                <p class="text-xs text-amber-800 mt-1 leading-relaxed">
                                    Une question fréquente au devoir de synthèse consiste à transformer une proposition subordonnée en Groupe Nominal (ou inversement).
                                </p>
                                <div class="mt-2 bg-white p-2 rounded border border-amber-100 text-xs space-y-1">
                                    <div><strong>Subordonnée :</strong> <span class="text-primary">Quand le train est arrivé</span>, les voyageurs sont descendus.</div>
                                    <div><strong>Groupe Nominal :</strong> <span class="text-emerald-700 font-semibold">À l'arrivée du train</span>, les voyageurs sont descendus.</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

